[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-downloader"
dynamic = ["version"]
description = "A simple tool used to retrieve chat messages from livestreams, videos, clips and past broadcasts. No authentication needed!"
readme = "README.rst"
license = "MIT"
requires-python = ">=3.6"
authors = [
    { name = "xenova", email = "admin@xenova.com" },
    { name = "EmperorArthur", email = "git@cd-net.net" },
]
keywords = [
    "chat",
    "downloader",
    "python",
    "twitch",
    "youtube",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "colorlog",
    "docstring-parser",
    "isodate",
    "requests",
    "websocket-client",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "tox",
    "twine",
    "wheel",

    # Testing and coverage
    "pytest",
    "coverage",

    # Documentation
    "sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-programoutput",
]

[project.scripts]
chat_downloader = "chat_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/xenova/chat-downloader"

[tool.pytest.ini_options]
addopts = ["--ignore=tests/test_generators.py"]

[tool.setuptools.dynamic]
version = {attr = "chat_downloader.metadata.__version__"}

[tool.setuptools.package-data]
chat_downloader = ['formatting/*.json']
